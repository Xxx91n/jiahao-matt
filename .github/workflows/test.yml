name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check inject-rules.mjs
          node --check test/inject-rules.test.mjs
      - name: Run tests
        run: node --test test/inject-rules.test.mjs
